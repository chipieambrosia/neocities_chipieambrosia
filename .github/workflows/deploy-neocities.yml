name: Deploy to Neocities

on:
  push:
    branches: [main]
    paths:
      - 'project_4_upgraded_vocab_practice.html'
      - '.github/workflows/deploy-neocities.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Project 4 vocab practice
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          set -e
          test -n "$NEOCITIES_API_KEY"

          # Neocities expects the multipart field name itself to be the destination path.
          RESPONSE=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            -F "Beni_gyakorlás/project_4_upgraded_vocab_practice.html=@project_4_upgraded_vocab_practice.html" \
            https://neocities.org/api/upload)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"result"[[:space:]]*:[[:space:]]*"success"'

          # Verify the destination path after upload.
          LIST=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            --get --data-urlencode "path=Beni_gyakorlás" \
            https://neocities.org/api/list)
          echo "$LIST"
          echo "$LIST" | grep -Fq '"path":"Beni_gyakorlás/project_4_upgraded_vocab_practice.html"' || \
          echo "$LIST" | grep -Fq '"path": "Beni_gyakorlás/project_4_upgraded_vocab_practice.html"'
