<script>const allGroups={"Introduction": {"A – An unusual day": [["videófelvevő", "camcorder"], ["főzés, szakácsművészet", "cookery"], ["pénzadománygyűjtés", "fundraising"], ["arckép", "portrait"], ["pénzt gyűjt / előteremt", "raise money"], ["testvériskola", "twin school"]], "B – Kids": [["biztos", "definite"], ["Várj egy percet!", "Hang on a minute."], ["Gondolom…", "I suppose…"], ["Fogalmam sincs.", "I've got no idea."], ["döntést hoz", "make a decision"], ["verseny", "tournament"], ["munkatapasztalat", "work experience"]]}, "Unit 1": {"1A – The Iceman": [["régész", "archaeologist"], ["nyíl", "arrow"], ["nyílhegy", "arrowhead"], ["Krisztus / időszámításunk előtt", "BC"], ["íj", "bow"], ["köpeny", "cloak"], ["gabona", "corn"], ["megfagy", "freeze"], ["folyamatban", "in progress"], ["anyag", "material"], ["ösvény", "path"], ["lő", "shoot"], ["tapasztalt, fejlett", "sophisticated"], ["kőkorszak", "Stone Age"], ["vízálló", "waterproof"], ["gyapjú", "woollen"], ["megröntgenez", "X-ray"]], "Materials": [["vörösréz", "copper"], ["gyapot, pamut", "cotton"], ["bőr", "leather"], ["poliészter (műanyag)", "polyester"], ["selyem", "silk"], ["acél", "steel"], ["gyapjú", "wool"]], "1B – We used to be rivals": [["építész / kivitelező", "builder"], ["elrak, eltesz", "put away"]], "1C – Clothes": [["üzlettárs", "business partner"], ["szövetanyag", "cloth"], ["kényelmes", "comfortable"], ["farmer(nadrág)", "denim"], ["dizájner", "designer"], ["mozgólépcső", "escalator"], ["divatos", "fashionable"], ["illik rá, méretben jó rá", "fit"], ["aranyásó", "gold miner"], ["áruk", "goods"], ["magas sarkú", "high-heeled"], ["bevándorló", "immigrant"], ["behoz az országba", "import"], ["ruhadarab", "item of clothing"], ["eredetileg", "originally"], ["szabadalom", "patent"], ["vasútépítő", "railway worker"], ["szeges", "rivet"], ["fazon, stílus", "style"], ["felpróbál valamit", "try something on"], ["alsónemű", "underwear"], ["nagykereskedő", "wholesaler"]], "Describing clothes": [["bő, buggyos", "baggy"], ["kockás", "checked"], ["trapéz", "flared"], ["lapos", "flat"], ["hosszú ujjú", "long-sleeved"], ["bő", "loose"], ["egyszínű", "plain"], ["pöttyös", "pointed"], ["rövid ujjú", "short-sleeved"], ["csíkos", "striped"], ["szűk, szoros", "tight"]], "1D – Kids": [["Legközelebb jobban sikerül!", "Better luck next time."], ["első, utolsó helyen végez", "come first, last, etc."], ["Gratulálok!", "Congratulations!"], ["elég jól megy neki", "do quite well"], ["megbukik (vizsgán)", "fail"], ["Hogy sikerült?", "How did it go?"], ["Hogy ment neked?", "How did you get on?"], ["Hogy ment neked?", "How did you do?"], ["Drukkolok neked.", "I'll keep my fingers crossed for you."], ["Örömmel hallom.", "I'm glad to hear that."], ["Sajnálattal hallom.", "I'm sorry to hear that."], ["osztályzat", "mark"], ["Ne búsulj!", "Never mind."], ["átmegy (vizsgán)", "pass"], ["Kár. Sajnálom.", "That's a pity."], ["Jól van! / Ügyes!", "That's pretty good."]], "Culture": [["időszámításunk szerint", "AD"], ["csata", "battle"], ["császár", "emperor"], ["birodalom", "empire"], ["fokozatosan", "gradually"], ["véget ér", "in the end"], ["megszáll, lerohan", "invade"], ["megszállás", "invasion"], ["királyság", "kingdom"], ["törzs", "tribe"], ["egyesül, egyesít", "unite"]], "English Across the Curriculum": [["alumínium", "aluminium"], ["bakelit (műanyag)", "Bakelite"], ["bronz", "bronze"], ["faszén, rajzszén", "charcoal"], ["vegyész", "chemist"], ["szén", "coal"], ["kéreg", "crust"], ["ipari", "industrial"], ["különösképpen", "in particular"], ["helyett", "instead of"], ["vezet valamihez", "lead to"], ["ásvány", "mineral"], ["molekula", "molecule"], ["nejlon", "nylon"], ["érc", "ore"], ["PVC (polivinilklorid – műanyag)", "PVC"], ["felvált", "replace"], ["forradalom", "revolution"], ["szétválaszt", "separate"], ["éles", "sharp"], ["gőzmozdony", "steam engine"], ["szintetikus, mesterségesen előállított", "synthetic"], ["ón", "tin"], ["fegyver", "weapon"]], "Revision": [["tüzet fog", "catch fire"], ["erősen", "heavily"], ["meggyújtja a gázt", "light the gas"], ["megbotlik", "trip"]], "Your Project": [["bár", "although"], ["bolond, buta", "foolish"], ["felidéz", "recall"], ["rímel", "rhyme"], ["tervez", "scheme"], ["múlatja / kellemesen eltölti az időt", "while the time away"]]}},mainSel=document.getElementById('mainGroup'),sel=document.getElementById('group'),card=document.getElementById('card'),hu=document.getElementById('hu'),en=document.getElementById('en'),section=document.getElementById('section'),count=document.getElementById('count'),bar=document.getElementById('bar');let cards=[],i=0;Object.keys(allGroups).forEach(k=>mainSel.add(new Option(k,k)));
function fillSections(){sel.innerHTML='';Object.keys(allGroups[mainSel.value]).forEach(k=>sel.add(new Option(k,k)));groups=allGroups[mainSel.value]}
let groups=allGroups[Object.keys(allGroups)[0]];fillSections();function load(){cards=groups[sel.value].map(x=>[...x]);i=0;show()}function show(){card.classList.remove('flipped');hu.textContent=cards[i][0];en.textContent=cards[i][1];section.textContent=sel.value;count.textContent=(i+1)+' / '+cards.length;bar.style.width=((i+1)/cards.length*100)+'%'}sel.onchange=load;card.onclick=()=>card.classList.toggle('flipped');flip.onclick=e=>{e.stopPropagation();card.classList.toggle('flipped')};next.onclick=()=>{i=(i+1)%cards.length;show()};prev.onclick=()=>{i=(i-1+cards.length)%cards.length;show()};shuffle.onclick=()=>{for(let j=cards.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[cards[j],cards[k]]=[cards[k],cards[j]]}i=0;show()};speak.onclick=e=>{e.stopPropagation();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cards[i][1]);u.lang='en-GB';let v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en-GB'))||speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();else if(e.key==='ArrowLeft')prev.click();else if(e.key===' '){e.preventDefault();flip.click()}});
let memoryCards=[],first=null,second=null,lock=false,moves=0,matched=0;
const tabFlip=document.getElementById('tabFlip'),tabMemory=document.getElementById('tabMemory'),
flipMode=document.getElementById('flipMode'),memoryMode=document.getElementById('memoryMode'),
memoryGrid=document.getElementById('memoryGrid'),memoryInfo=document.getElementById('memoryInfo');
function shuffleArray(a){for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function buildMemory(){
 let source=groups[sel.value], arr=[];
 source.forEach((x,idx)=>{arr.push({id:idx,text:x[0],lang:'HU'});arr.push({id:idx,text:x[1],lang:'EN'})});
 memoryCards=shuffleArray(arr);moves=0;matched=0;first=second=null;lock=false;memoryGrid.innerHTML='';
 memoryCards.forEach((c,n)=>{let b=document.createElement('button');b.className='mem';b.dataset.n=n;
 b.innerHTML='<div class="mem-inner"><div class="mem-front">?</div><div class="mem-back">'+c.text+'</div></div>';
 b.onclick=()=>pickMemory(b,c);memoryGrid.appendChild(b)});updateMemory()
}
function updateMemory(){memoryInfo.textContent='Párok: '+matched+' / '+groups[sel.value].length+' • Próbálkozások: '+moves}
function pickMemory(el,c){
 if(lock||el.classList.contains('open')||el.classList.contains('matched'))return;
 el.classList.add('open');
 if(!first){first={el,c};return}
 second={el,c};moves++;lock=true;
 if(first.c.id===second.c.id && first.c.lang!==second.c.lang){
   first.el.classList.add('matched');second.el.classList.add('matched');matched++;first=second=null;lock=false;updateMemory();
   if(matched===groups[sel.value].length)setTimeout(()=>memoryInfo.textContent='🎉 Kész! Minden pár megvan. • Próbálkozások: '+moves,250);
 }else{
   updateMemory();setTimeout(()=>{first.el.classList.remove('open');second.el.classList.remove('open');first=second=null;lock=false},850)
 }
}
tabFlip.onclick=()=>{tabFlip.classList.add('active');tabMemory.classList.remove('active');flipMode.style.display='block';memoryMode.style.display='none'}
tabMemory.onclick=()=>{tabMemory.classList.add('active');tabFlip.classList.remove('active');flipMode.style.display='none';memoryMode.style.display='block';buildMemory()}
const oldChange=sel.onchange;sel.onchange=()=>{oldChange();if(memoryMode.style.display==='block')buildMemory()};mainSel.onchange=()=>{fillSections();load();if(memoryMode.style.display==='block')buildMemory()}

const mobileViewBtn=document.getElementById('mobileView');

 document.body.classList.add(mode+'-view');

let savedView=localStorage.getItem('project4-view');
if(!savedView) savedView=window.innerWidth<=650?'mobile':'laptop';
setView(savedView);

const tabGuess=document.getElementById('tabGuess'),guessMode=document.getElementById('guessMode');
const guessArt=document.getElementById('guessArt'),letterBoxes=document.getElementById('letterBoxes'),guessInput=document.getElementById('guessInput'),guessFeedback=document.getElementById('guessFeedback'),guessCount=document.getElementById('guessCount');
let guessOrder=[],guessPos=0,hintLevel=0;
const clueMap={
"camcorder":["🎥","👦"],"cookery":["👨‍🍳","🍲"],"fundraising":["🤲","💰","❤️"],"portrait":["🧑","🖼️"],"raise money":["🪙","⬆️","❤️"],"twin school":["🏫","🤝","🏫"],
"definite":["❓","➡️","✅"],"hang on a minute.":["✋","⏱️"],"i suppose…":["🤔","💭","👍"],"i've got no idea.":["🤷","❓"],"make a decision":["🤔","↔️","✅"],"tournament":["🏆","⚔️","🏆"],"work experience":["🧑‍💼","🛠️","📋"],
"archaeologist":["⛏️","🏺","🧑"],"arrow":["🏹","➡️"],"arrowhead":["➡️","🔺"],"bc":["🏛️","⏪","📅"],"bow":["🏹"],"cloak":["🧥","🌬️"],"corn":["🌽"],"freeze":["🥶","❄️"],"in progress":["🚧","⚙️"],"material":["🧵","🪵","🔩"],"path":["🌲","〰️","🌲"],"shoot":["🏹","🎯"],"sophisticated":["⚙️","✨","🧠"],"stone age":["🪨","🔥","🏕️"],"waterproof":["☔","💧","🧥"],"woollen":["🐑","🧶","🧣"],"x-ray":["🩻","🦴"],
"copper":["🪙","🔌"],"cotton":["☁️","👕"],"leather":["🐄","👞"],"polyester":["🧪","👕"],"silk":["🐛","🧵","👗"],"steel":["🏗️","🔩"],"wool":["🐑","🧶"],
"builder":["👷","🧱","🏠"],"put away":["📦","➡️","🗄️"],
"business partner":["💼","🤝","💼"],"cloth":["🧵","🟫"],"comfortable":["🛋️","😌"],"denim":["👖"],"designer":["✏️","👗"],"escalator":["🪜","⬆️","👥"],"fashionable":["😎","👗","✨"],"fit":["👕","✅","🧍"],"gold miner":["⛏️","🪙"],"goods":["📦","📦"],"high-heeled":["👠"],"immigrant":["🧳","➡️","🏠"],"import":["📦","➡️","🏳️"],"item of clothing":["👕","👖","🧥"],"originally":["⏮️","💡"],"patent":["💡","📜","🔒"],"railway worker":["👷","🛤️"],"rivet":["🔩","🔨"],"style":["👗","✨"],"try something on":["👕","➡️","🧍","🪞"],"underwear":["🩲"],"wholesaler":["🏭","📦","📦","🏪"]
};
function normAns(x){return x.toLowerCase().trim().replace(/[’]/g,"'").replace(/\s+/g," ")}
function getCurrentGuessWords(){return groups[sel.value].map(x=>x[1])}
function buildGuessGame(){guessOrder=getCurrentGuessWords().map((w,i)=>({w,i}));shuffleArray(guessOrder);guessPos=0;showGuess()}
function clueFor(w){return clueMap[normAns(w)]||["🤔","💡","🖼️"]}
function shownChars(word,level){
 let chars=[...word],letters=chars.map((c,i)=>/[A-Za-z]/.test(c)?i:-1).filter(i=>i>=0),show=new Set();
 if(level>=1&&letters.length)show.add(letters[0]);
 if(level>=2&&letters.length)show.add(letters[letters.length-1]);
 if(level>=3){for(let j=0;j<Math.ceil(letters.length/2);j+=2)show.add(letters[j]);for(let j=1;show.size<Math.ceil(letters.length/2)&&j<letters.length;j+=2)show.add(letters[j])}
 return chars.map((c,i)=>({c,show:show.has(i)}))
}
function renderBoxes(){
 let word=guessOrder[guessPos].w;letterBoxes.innerHTML='';
 shownChars(word,hintLevel).forEach(o=>{let d=document.createElement('div');
 if(o.c===" "){d.className="letter-space";d.textContent=""}
 else if(!/[A-Za-z]/.test(o.c)){d.className="letter-punct";d.textContent=o.c}
 else{d.className="letter-box";d.textContent=o.show?o.c.toUpperCase():""}
 letterBoxes.appendChild(d)})
}
function showGuess(){
 if(!guessOrder.length)return;hintLevel=0;guessInput.value="";guessFeedback.textContent="";
 let w=guessOrder[guessPos].w;guessArt.innerHTML='<div class="guess-scene">'+clueFor(w).map(x=>'<span>'+x+'</span>').join('')+'</div>';
 guessCount.textContent=(guessPos+1)+" / "+guessOrder.length;renderBoxes()
}
document.getElementById('hint1').onclick=()=>{hintLevel=Math.max(hintLevel,1);renderBoxes()}
document.getElementById('hint2').onclick=()=>{hintLevel=Math.max(hintLevel,2);renderBoxes()}
document.getElementById('hint3').onclick=()=>{hintLevel=3;renderBoxes()}
document.getElementById('checkGuess').onclick=()=>{
 let ok=normAns(guessInput.value).replace(/[.!?…]+$/,"")===normAns(guessOrder[guessPos].w).replace(/[.!?…]+$/,"");
 guessFeedback.textContent=ok?"✓ Helyes!":"✗ Próbáld újra!";
